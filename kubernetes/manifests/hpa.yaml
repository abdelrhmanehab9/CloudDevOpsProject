apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: clouddevopsproject-hpa
  namespace: ivolve
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: clouddevopsproject-deployment
  minReplicas: 3
  maxReplicas: 7
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

